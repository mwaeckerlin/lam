# E2E stack: both images of this project in front of a real OpenLDAP server,
# four times — configured from the environment on an empty volume, started
# without LAM_PASSWORD, started on the volumes of an existing installation
# without variables, and started on such volumes with variables set.
name: lam-e2e

x-lam: &lam
  image: mwaeckerlin/lam:php-fpm
  build:
    context: ../..
    target: php-fpm

x-lam-proxy: &lam-proxy
  image: mwaeckerlin/lam:nginx
  build:
    context: ../..
    target: nginx

services:

  openldap:
    build:
      context: openldap

  lam:
    <<: *lam
    environment:
      LDAP_SERVER: ldap://openldap:389
      LDAP_DOMAIN: example.org
      LAM_PASSWORD: lam-e2e-password
    volumes:
      - lam-config:/etc/ldap-account-manager
      - lam-data:/var/lib/ldap-account-manager
    depends_on:
      - openldap

  lam-proxy:
    <<: *lam-proxy
    depends_on:
      - lam

  unconfigured:
    <<: *lam

  unconfigured-proxy:
    <<: *lam-proxy
    environment:
      PHP_FPM_HOST: unconfigured
    depends_on:
      - unconfigured

  upgrade:
    <<: *lam
    volumes:
      - upgrade-config:/etc/ldap-account-manager
      - upgrade-data:/var/lib/ldap-account-manager
    depends_on:
      - openldap

  upgrade-seed:
    build:
      context: .
    command: ["python", "seed_upgrade.py"]
    volumes:
      - upgrade-config:/etc/ldap-account-manager
      - upgrade-data:/var/lib/ldap-account-manager
    depends_on:
      - upgrade

  upgrade-proxy:
    <<: *lam-proxy
    environment:
      PHP_FPM_HOST: upgrade
    depends_on:
      - upgrade

  reconfigure:
    <<: *lam
    environment:
      LDAP_SERVER: ldap://openldap:389
      LAM_LANG: de_DE
      LAM_PASSWORD: password-set-after-the-installation
    volumes:
      - reconfigure-config:/etc/ldap-account-manager
      - reconfigure-data:/var/lib/ldap-account-manager
    depends_on:
      - openldap

  reconfigure-seed:
    build:
      context: .
    command: ["python", "seed_upgrade.py"]
    environment:
      SEED_SERVER: ldap://old-server:389
    volumes:
      - reconfigure-config:/etc/ldap-account-manager
      - reconfigure-data:/var/lib/ldap-account-manager
    depends_on:
      - reconfigure

  reconfigure-proxy:
    <<: *lam-proxy
    environment:
      PHP_FPM_HOST: reconfigure
    depends_on:
      - reconfigure

  test-runner:
    build:
      context: .
    depends_on:
      - lam-proxy
      - unconfigured-proxy
      - upgrade-proxy
      - reconfigure-proxy
    environment:
      LAM_URL: http://lam-proxy:8080
      UNCONFIGURED_URL: http://unconfigured-proxy:8080
      UPGRADE_URL: http://upgrade-proxy:8080
      RECONFIGURE_URL: http://reconfigure-proxy:8080
    volumes:
      - lam-config:/lam-config:ro
      - lam-data:/lam-data:ro
      - upgrade-config:/upgrade-config:ro
      - upgrade-data:/upgrade-data:ro
      - reconfigure-config:/reconfigure-config:ro
      - reconfigure-data:/reconfigure-data:ro
    command: ["pytest", "-v", "--tb=short"]

volumes:
  lam-config:
  lam-data:
  upgrade-config:
  upgrade-data:
  reconfigure-config:
  reconfigure-data:
